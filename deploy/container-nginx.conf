# Mirrors the ise-test vhost: nginx serves /static/ and /media/ directly and
# proxies everything else to gunicorn. Django with DEBUG=False will not serve
# static files itself, so without this the app renders unstyled.
server {
    listen 3000;
    client_max_body_size 20M;

    location = /api/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","app":"conference"}';
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # User uploads. Mounted from a volume, so this is the one path whose
    # contents are not in the image.
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:3998;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
