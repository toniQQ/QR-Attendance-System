# QR Attendance System - conference.intelligentso.com
# Pre-SSL config: run `sudo certbot --nginx -d conference.intelligentso.com`
# after enabling - certbot rewrites this with the 443 block and the 80->443
# redirect.
server {
    server_name conference.intelligentso.com;

    client_max_body_size 20M;

    # Allow certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Django static files (collectstatic output)
    location /static/ {
        alias /home/quinto/QR-Attendance-System/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded event logos
    location /media/ {
        alias /home/quinto/QR-Attendance-System/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Gunicorn (QR Attendance System)
    location / {
        proxy_pass http://127.0.0.1:3998;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
